name: Build and publish WASM package

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run tests
        run: cargo test --locked

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build wasm package
        run: wasm-pack build --release --target bundler --out-dir pkg

      - name: Determine next package version
        id: version
        run: |
          if git fetch origin build 2>/dev/null && git show FETCH_HEAD:package.json > /tmp/prev.json 2>/dev/null; then
            PREV=$(node -p "require('/tmp/prev.json').version")
          else
            PREV="0.0.0"
          fi
          NEXT=$(node -e "
            const [maj, min, pat] = '$PREV'.split('.').map(Number);
            console.log(\`\${maj}.\${min}.\${pat + 1}\`);
          ")
          echo "Previous version: $PREV -> next version: $NEXT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Set package version
        run: npm --prefix pkg version ${{ steps.version.outputs.next }} --no-git-tag-version --allow-same-version

      - name: Publish build output to build branch
        working-directory: pkg
        run: |
          rm -f .gitignore
          git init -q
          git checkout -q -b build
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build v${{ steps.version.outputs.next }} from ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build:build
